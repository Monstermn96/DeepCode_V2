name: deepdevai-amplify

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"  # Vite dev server
      - "3000:3000"  # Backend API
      - "20002:20002"  # Amplify sandbox
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
      - VITE_AMPLIFY_ENV=sandbox
      - CHOKIDAR_USEPOLLING=true
      - AMPLIFY_CLI_MIGRATION_STEPS=true
    command: >
      sh -c "
        echo 'Cleaning up any existing amplify_outputs.json...' &&
        rm -rf /app/amplify_outputs.json &&
        echo 'Starting Amplify sandbox...' &&
        (npx ampx sandbox > /tmp/amplify.log 2>&1 &) &&
        echo 'Waiting for amplify_outputs.json to be generated...' &&
        while [ ! -f /app/amplify_outputs.json ]; do
          if [ -f /tmp/amplify.log ]; then
            tail -n 1 /tmp/amplify.log
          fi
          sleep 1
        done &&
        echo 'amplify_outputs.json found! Starting Vite dev server...' &&
        npm run dev -- --host 0.0.0.0"

volumes:
  amplify_outputs: 