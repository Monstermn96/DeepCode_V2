version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - echo "Installing dependencies for $AWS_BRANCH environment..."
            - export NODE_OPTIONS=--max_old_space_size=4096
            - nvm install 20
            - nvm use 20
            - node -v
            - npm ci
            - npm install -g @aws-amplify/cli@latest @aws-amplify/backend-cli typescript vite
            - |
              if [ "$AWS_BRANCH" = "sandbox" ]; then
                echo "Setting up sandbox environment..."
                export NODE_ENV=development
                export VITE_AMPLIFY_ENV=sandbox
              elif [ "$AWS_BRANCH" = "PreDeploy" ]; then
                echo "Setting up PreDeploy environment..."
                export NODE_ENV=staging
                export VITE_AMPLIFY_ENV=predeploy
              else
                echo "Setting up production environment..."
                export NODE_ENV=production
                export VITE_AMPLIFY_ENV=production
              fi
            - echo "Building Docker image for $AWS_BRANCH environment..."
            - docker build -t deepdevai-amplify \
              --build-arg NODE_ENV=${NODE_ENV:-development} \
              --build-arg VITE_AMPLIFY_ENV=${VITE_AMPLIFY_ENV:-sandbox} \
              .
        build:
          commands:
            - echo "Running build in Docker container for $AWS_BRANCH environment..."
            - |
              if [ "$AWS_BRANCH" = "sandbox" ]; then
                docker run --rm \
                  -e NODE_ENV=development \
                  -e VITE_AMPLIFY_ENV=sandbox \
                  deepdevai-amplify \
                  sh -c "npm run dev -- --host 0.0.0.0 & npx ampx sandbox"
              else
                docker run --rm \
                  -e NODE_ENV=${NODE_ENV} \
                  -e VITE_AMPLIFY_ENV=${VITE_AMPLIFY_ENV} \
                  deepdevai-amplify \
                  npm run build
              fi
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .npm/**/*
          - .cache/**/*
    appRoot: .
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'Strict-Transport-Security'
            value: 'max-age=31536000; includeSubDomains'
          - key: 'X-Frame-Options'
            value: 'SAMEORIGIN'
          - key: 'X-XSS-Protection'
            value: '1; mode=block'
          - key: 'X-Content-Type-Options'
            value: 'nosniff'
    test:
      phases:
        preTest:
          commands:
            - docker run --rm deepdevai-amplify npm ci
            - docker run --rm deepdevai-amplify npm install -g typescript
        test:
          commands:
            - |
              if [ "$AWS_BRANCH" != "sandbox" ]; then
                docker run --rm deepdevai-amplify npm run test
              fi
      artifacts:
        baseDirectory: coverage
        files:
          - '**/*'
        configFilePath: '**/coverage-final.json'