version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - "echo 'Installing dependencies for $AWS_BRANCH environment...'"
            - "export NODE_OPTIONS=--max_old_space_size=4096"
            - "nvm install 20"
            - "nvm use 20"
            - "node -v"
            - "npm ci"
            - "npm install -g @aws-amplify/cli@latest @aws-amplify/backend-cli typescript vite"
            # Install backend dependencies
            - "echo 'Installing backend dependencies...'"
            - "cd amplify && npm install && cd .."
            # Generate amplify_outputs.json from existing deployed backend
            - "echo 'Generating amplify_outputs.json from deployed backend...'"
            - "echo 'AWS_APP_ID: $AWS_APP_ID'"
            - "echo 'AWS_BRANCH: $AWS_BRANCH'"
            - "npx ampx generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID"
            # Verify the file was generated
            - "echo 'Checking if amplify_outputs.json was generated...'"
            - "ls -la amplify_outputs.json || echo 'amplify_outputs.json not found'"
            - "cat amplify_outputs.json || echo 'Could not read amplify_outputs.json'"
            # Copy outputs to public directory so frontend can access it during build
            - "echo 'Copying amplify_outputs.json to public directory...'"
            - "mkdir -p public"
            - "cp amplify_outputs.json public/amplify_outputs.json || echo 'Failed to copy to public'"
            - "ls -la public/"
        build:
          commands:
            - |
              echo "Building for $AWS_BRANCH environment..."
              if [ "$AWS_BRANCH" = "sandbox" ]; then
                echo "Setting up sandbox environment..."
                echo "Building sandbox..."
                NODE_ENV=development VITE_AMPLIFY_ENV=sandbox npx ampx sandbox --once
              elif [ "$AWS_BRANCH" = "PreDeploy" ]; then
                echo "Setting up PreDeploy environment..."
                echo "Building application with NODE_ENV=staging and VITE_AMPLIFY_ENV=predeploy..."
                NODE_ENV=staging VITE_AMPLIFY_ENV=predeploy npm run build
              else
                echo "Setting up production environment..."
                echo "Building application with NODE_ENV=production and VITE_AMPLIFY_ENV=production..."
                NODE_ENV=production VITE_AMPLIFY_ENV=production npm run build
              fi
            # Ensure amplify_outputs.json is in the final build
            - "echo 'Ensuring amplify_outputs.json is in dist...'"
            - "mkdir -p dist"
            - "cp amplify_outputs.json dist/amplify_outputs.json || echo 'Failed to copy to dist'"
            - "cp public/amplify_outputs.json dist/amplify_outputs.json || echo 'Failed to copy from public to dist'"
            - "ls -la dist/amplify_outputs.json || echo 'amplify_outputs.json not in dist'"
            - "cat dist/amplify_outputs.json || echo 'Could not read dist/amplify_outputs.json'"
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .npm/**/*
          - .cache/**/*
          - amplify/node_modules/**/*
    appRoot: .
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'Strict-Transport-Security'
            value: 'max-age=31536000; includeSubDomains'
          - key: 'X-Frame-Options'
            value: 'SAMEORIGIN'
          - key: 'X-XSS-Protection'
            value: '1; mode=block'
          - key: 'X-Content-Type-Options'
            value: 'nosniff'
    test:
      phases:
        preTest:
          commands:
            - "npm ci"
            - "npm install -g typescript"
        test:
          commands:
            - |
              if [ "$AWS_BRANCH" != "sandbox" ]; then
                echo "Running tests for $AWS_BRANCH..."
                npm run test || echo "Tests not configured, skipping..."
              fi
              # Create empty test results to satisfy artifacts requirement
              mkdir -p test-results
              echo "No tests configured" > test-results/test-summary.txt
      artifacts:
        baseDirectory: test-results
        files:
          - '**/*'