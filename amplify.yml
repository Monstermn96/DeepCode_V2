applications:
  - appRoot: .
    backend:
      phases:
        preBuild:
          commands:
            - "echo 'Starting backend preBuild phase...'"
            - "echo 'Updating Node version...'"
            - 'nvm install 22'
            - 'nvm use 22'
            - 'npm install -g @aws-amplify/cli'
            - 'npm ci'
            - 'npm install aws-amplify@6.13.1 @aws-amplify/backend@1.14.1 @aws-amplify/ui-react@6.9.1'
            - 'npm install --save-dev @types/react @types/react-dom @types/node @types/babel__generator @types/babel__template @types/babel__traverse @types/prop-types @types/aws-lambda @types/react-router-dom @types/react-transition-group'
        build:
          commands:
            - "echo 'Starting backend build phase...'"
            - "npm run build"
    frontend:
      phases:
        preBuild:
          commands:
            - "echo 'Starting frontend preBuild phase...'"
            - "echo 'Updating Node version...'"
            - 'nvm install 22'
            - 'nvm use 22'
            - 'npm ci'
            - 'npm install aws-amplify@6.13.1 @aws-amplify/backend@1.14.1 @aws-amplify/ui-react@6.9.1'
            - 'npm install --save-dev @types/react @types/react-dom @types/node @types/babel__generator @types/babel__template @types/babel__traverse @types/prop-types @types/aws-lambda @types/react-router-dom @types/react-transition-group'
            - 'npm install qrcode.react monaco-editor @monaco-editor/react'
            - 'npm install react-router react-router-dom@7.2.0 react-transition-group simplebar simplebar-react'
            - 'npm install @aws-sdk/client-cognito-identity-provider @aws-sdk/client-amplify @aws-sdk/client-dynamodb @aws-sdk/lib-dynamodb @aws-sdk/client-secrets-manager'
        build:
          commands:
            - "echo 'Starting frontend build phase...'"
            - 'if [ "$FIRST_DEPLOY" = "true" ]; then node ./scripts/update-auth-config.js; fi'
            - "npm run build"
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'Cache-Control'
            value: 'max-age=0,no-cache,no-store,must-revalidate'