applications:
  - appRoot: .
    backend:
      phases:
        preBuild:
          commands:
            # Version checking commands
            - "echo '=== Environment & Package Versions (Backend) ==='"
            - "echo 'Operating System:' && uname -a || ver"
            - "echo 'Node version:' && node --version"
            - "echo 'NPM version:' && npm --version"
            - "echo 'Python version:' && python --version || echo 'Python not found'"
            - "echo 'AWS CLI version:' && aws --version || echo 'AWS CLI not found'"
            - "echo 'Git version:' && git --version"
            - "echo 'TypeScript version:' && tsc --version || echo 'TypeScript not installed yet'"
            - "echo 'Current directory:' && pwd"
            - "echo 'Environment variables:'"
            - "echo '  AMPLIFY_ENV=' $AMPLIFY_ENV"
            - "echo '  NODE_VERSION=' $NODE_VERSION"
            - "echo '  AWS_APP_ID=' $AWS_APP_ID"
            - "echo '  AWS_REGION=' $AWS_REGION"
            - "echo '=== Starting Backend Build Process ==='"
            # Existing commands
            - "echo 'Starting backend preBuild phase...'"
            - "echo 'Updating Node version...'"
            - 'nvm install 22'
            - 'nvm use 22'
            - 'npm install -g @aws-amplify/cli'
            - 'rm -rf node_modules package-lock.json'
            - 'npm install'
            - 'npm install aws-amplify@6.13.0 @aws-amplify/backend@1.14.1 @aws-amplify/ui-react@6.5.5'
            - 'npm install --save-dev @types/react@18.2.66 @types/react-dom@18.2.22 @types/node@22.13.4 @types/babel__generator @types/babel__template @types/babel__traverse @types/prop-types @types/aws-lambda@8.10.147 @types/react-router-dom@5.3.3 @types/react-transition-group@4.4.12'
            - 'npm install json-schema-to-ts@3.1.1 ts-algebra@2.0.0 --save-dev'
            - 'npm install --save-dev typescript@5.7.3'
            - 'npm install'
            # Post-install version check
            - "echo '=== Installed Package Versions (Backend) ==='"
            - "echo 'Installed packages:' && npm list --depth=0"
            - "echo '=== End Version Check ==='"
        build:
          commands:
            - "echo 'Starting backend build phase...'"
            - "npm run build"
    frontend:
      phases:
        preBuild:
          commands:
            # Version checking commands
            - "echo '=== Environment & Package Versions (Frontend) ==='"
            - "echo 'Operating System:' && uname -a || ver"
            - "echo 'Node version:' && node --version"
            - "echo 'NPM version:' && npm --version"
            - "echo 'Python version:' && python --version || echo 'Python not found'"
            - "echo 'AWS CLI version:' && aws --version || echo 'AWS CLI not found'"
            - "echo 'Git version:' && git --version"
            - "echo 'TypeScript version:' && tsc --version || echo 'TypeScript not installed yet'"
            - "echo 'Current directory:' && pwd"
            - "echo 'Environment variables:'"
            - "echo '  AMPLIFY_ENV=' $AMPLIFY_ENV"
            - "echo '  NODE_VERSION=' $NODE_VERSION"
            - "echo '  AWS_APP_ID=' $AWS_APP_ID"
            - "echo '  AWS_REGION=' $AWS_REGION"
            - "echo '=== Starting Frontend Build Process ==='"
            # Existing commands
            - "echo 'Starting frontend preBuild phase...'"
            - "echo 'Updating Node version...'"
            - 'nvm install 22'
            - 'nvm use 22'
            - 'rm -rf node_modules package-lock.json'
            - 'npm install'
            - 'npm install aws-amplify@6.13.0 @aws-amplify/backend@1.14.1 @aws-amplify/ui-react@6.5.5'
            - 'npm install --save-dev @types/react@18.2.66 @types/react-dom@18.2.22 @types/node@22.13.4 @types/babel__generator @types/babel__template @types/babel__traverse @types/prop-types @types/aws-lambda@8.10.147 @types/react-router-dom@5.3.3 @types/react-transition-group@4.4.12'
            - 'npm install qrcode.react@4.2.0 monaco-editor@0.52.2 @monaco-editor/react@4.7.0'
            - 'npm install react-router@7.1.5 react-router-dom@7.1.5 react-transition-group@4.4.5 simplebar@6.3.0 simplebar-react@3.3.0'
            - 'npm install @aws-sdk/client-cognito-identity-provider@3.525.0 @aws-sdk/client-amplify@3.525.0 @aws-sdk/client-dynamodb@3.750.0 @aws-sdk/lib-dynamodb@3.750.0 @aws-sdk/client-secrets-manager@3.744.0'
            - 'npm install json-schema-to-ts@3.1.1 ts-algebra@2.0.0 --save-dev'
            - 'npm install --save-dev typescript@5.7.3'
            - 'npm install'
            # Post-install version check
            - "echo '=== Installed Package Versions (Frontend) ==='"
            - "echo 'Installed packages:' && npm list --depth=0"
            - "echo '=== End Version Check ==='"
        build:
          commands:
            - "echo 'Starting frontend build phase...'"
            - 'if [ "$FIRST_DEPLOY" = "true" ]; then node ./scripts/update-auth-config.js; fi'
            - "npm run build"
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'Cache-Control'
            value: 'max-age=0,no-cache,no-store,must-revalidate'