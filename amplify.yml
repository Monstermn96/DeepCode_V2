version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - echo "Installing dependencies for $AWS_BRANCH environment..."
            - npm ci
            - npm install -g @aws-amplify/cli@latest @aws-amplify/backend-cli typescript vite
            - |
              if [ "$AWS_BRANCH" = "sandbox" ]; then
                echo "Setting up sandbox environment..."
                export NODE_ENV=development
                export VITE_AMPLIFY_ENV=sandbox
              elif [ "$AWS_BRANCH" = "PreDeploy" ]; then
                echo "Setting up PreDeploy environment..."
                export NODE_ENV=staging
                export VITE_AMPLIFY_ENV=predeploy
              else
                echo "Setting up production environment..."
                export NODE_ENV=production
                export VITE_AMPLIFY_ENV=production
              fi
        build:
          commands:
            - echo "Building for $AWS_BRANCH environment..."
            - |
              if [ "$AWS_BRANCH" = "sandbox" ]; then
                npm run dev -- --host 0.0.0.0 &
                npx ampx sandbox
              else
                npm run build
              fi
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .npm/**/*
          - .cache/**/*
    appRoot: .
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'Strict-Transport-Security'
            value: 'max-age=31536000; includeSubDomains'
          - key: 'X-Frame-Options'
            value: 'SAMEORIGIN'
          - key: 'X-XSS-Protection'
            value: '1; mode=block'
          - key: 'X-Content-Type-Options'
            value: 'nosniff'
    build:
      image: ./Dockerfile
      commands:
        - |
          if [ "$AWS_BRANCH" = "sandbox" ]; then
            echo "Running sandbox build..."
            npm run dev -- --host 0.0.0.0 &
            npx ampx sandbox
          elif [ "$AWS_BRANCH" = "PreDeploy" ]; then
            echo "Running PreDeploy build..."
            npm run build
          else
            echo "Running production build..."
            npm run build
          fi
    test:
      phases:
        preTest:
          commands:
            - npm ci
            - npm install -g typescript
        test:
          commands:
            - |
              if [ "$AWS_BRANCH" != "sandbox" ]; then
                npm run test
              fi
      artifacts:
        baseDirectory: coverage
        files:
          - '**/*'
        configFilePath: '**/coverage-final.json'
    environmentVariables:
      sandbox:
        - name: NODE_ENV
          value: development
        - name: VITE_AMPLIFY_ENV
          value: sandbox
        - name: AMPLIFY_CLI_MIGRATION_STEPS
          value: true
      PreDeploy:
        - name: NODE_ENV
          value: staging
        - name: VITE_AMPLIFY_ENV
          value: predeploy
      production:
        - name: NODE_ENV
          value: production
        - name: VITE_AMPLIFY_ENV
          value: production