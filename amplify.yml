version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - echo Installing dependencies for %AWS_BRANCH% environment...
            - npm.cmd ci
            - npm.cmd install -g @aws-amplify/cli@latest @aws-amplify/backend-cli typescript vite
            - IF "%AWS_BRANCH%"=="sandbox" (
                echo Setting up sandbox environment... &&
                set NODE_ENV=development &&
                set VITE_AMPLIFY_ENV=sandbox
              ) ELSE IF "%AWS_BRANCH%"=="PreDeploy" (
                echo Setting up PreDeploy environment... &&
                set NODE_ENV=staging &&
                set VITE_AMPLIFY_ENV=predeploy
              ) ELSE (
                echo Setting up production environment... &&
                set NODE_ENV=production &&
                set VITE_AMPLIFY_ENV=production
              )
        build:
          commands:
            - echo Building for %AWS_BRANCH% environment...
            - IF "%AWS_BRANCH%"=="sandbox" (
                npm.cmd run dev -- --host 0.0.0.0 &&
                npx.cmd ampx sandbox
              ) ELSE (
                npm.cmd run build
              )
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .npm/**/*
          - .cache/**/*
    appRoot: .
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'Strict-Transport-Security'
            value: 'max-age=31536000; includeSubDomains'
          - key: 'X-Frame-Options'
            value: 'SAMEORIGIN'
          - key: 'X-XSS-Protection'
            value: '1; mode=block'
          - key: 'X-Content-Type-Options'
            value: 'nosniff'
    build:
      image: ./Dockerfile
      commands:
        - IF "%AWS_BRANCH%"=="sandbox" (
            echo Running sandbox build... &&
            npm.cmd run dev -- --host 0.0.0.0 &&
            npx.cmd ampx sandbox
          ) ELSE IF "%AWS_BRANCH%"=="PreDeploy" (
            echo Running PreDeploy build... &&
            npm.cmd run build
          ) ELSE (
            echo Running production build... &&
            npm.cmd run build
          )
    test:
      phases:
        preTest:
          commands:
            - npm.cmd ci
            - npm.cmd install -g typescript
        test:
          commands:
            - IF NOT "%AWS_BRANCH%"=="sandbox" (
                npm.cmd run test
              )
      artifacts:
        baseDirectory: coverage
        files:
          - '**/*'
        configFilePath: '**/coverage-final.json'
    environmentVariables:
      sandbox:
        - name: NODE_ENV
          value: development
        - name: VITE_AMPLIFY_ENV
          value: sandbox
        - name: AMPLIFY_CLI_MIGRATION_STEPS
          value: true
      PreDeploy:
        - name: NODE_ENV
          value: staging
        - name: VITE_AMPLIFY_ENV
          value: predeploy
      production:
        - name: NODE_ENV
          value: production
        - name: VITE_AMPLIFY_ENV
          value: production