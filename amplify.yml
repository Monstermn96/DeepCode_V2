applications:
  - appRoot: .
    backend:
      phases:
        preBuild:
          commands:
            - nvm install 20
            - nvm use 20
            - if [ "$FORCE_CLEANUP" = "true" ]; then bash ./scripts/cleanup-predeploy.sh && sleep 10; fi
        build:
          commands:
            - npm install
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20
            - npm install
        build:
          commands:
            - if [ "$AUTO_UPDATE_AUTH" = "true" ]; then node ./scripts/update-auth-config.js; fi
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    environment:
      variables:
        FORCE_CLEANUP: "false"
        AUTO_UPDATE_AUTH: "true"
        NODE_VERSION: 20