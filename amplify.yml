applications:
  - appRoot: .
    backend:
      phases:
        preBuild:
          commands:
            - if ($env:FORCE_CLEANUP -eq "true") { ./scripts/cleanup-predeploy.ps1 }
        build:
          commands:
            - npm ci
            - npx ampx pipeline-deploy --branch $env:AWS_BRANCH --app-id $env:AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - if ($env:AUTO_UPDATE_AUTH -eq "true") { node ./scripts/update-auth-config.js }
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    environment:
      variables:
        FORCE_CLEANUP: "false"
        AUTO_UPDATE_AUTH: "true"