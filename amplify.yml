version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - "echo 'Installing dependencies for $AWS_BRANCH environment...'"
            - "export NODE_OPTIONS=--max_old_space_size=4096"
            - "nvm install 20"
            - "nvm use 20"
            - "node -v"
            - "npm ci"
            - "npm install -g @aws-amplify/cli@latest @aws-amplify/backend-cli typescript vite"
            - |
              if [ "$AWS_BRANCH" = "sandbox" ]; then
                echo "Setting up sandbox environment..."
                export NODE_ENV=development
                export VITE_AMPLIFY_ENV=sandbox
              elif [ "$AWS_BRANCH" = "PreDeploy" ]; then
                echo "Setting up PreDeploy environment..."
                export NODE_ENV=staging
                export VITE_AMPLIFY_ENV=predeploy
              else
                echo "Setting up production environment..."
                export NODE_ENV=production
                export VITE_AMPLIFY_ENV=production
              fi
            - "echo 'Environment variables set NODE_ENV=$NODE_ENV, VITE_AMPLIFY_ENV=$VITE_AMPLIFY_ENV'"
        build:
          commands:
            - "echo 'Building for $AWS_BRANCH environment...'"
            - |
              if [ "$AWS_BRANCH" = "sandbox" ]; then
                echo "Building sandbox environment..."
                npx ampx sandbox --once
              else
                echo "Building with NODE_ENV=$NODE_ENV and VITE_AMPLIFY_ENV=$VITE_AMPLIFY_ENV"
                npm run build
              fi
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .npm/**/*
          - .cache/**/*
    appRoot: .
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'Strict-Transport-Security'
            value: 'max-age=31536000; includeSubDomains'
          - key: 'X-Frame-Options'
            value: 'SAMEORIGIN'
          - key: 'X-XSS-Protection'
            value: '1; mode=block'
          - key: 'X-Content-Type-Options'
            value: 'nosniff'
    test:
      phases:
        preTest:
          commands:
            - "npm ci"
            - "npm install -g typescript"
        test:
          commands:
            - |
              if [ "$AWS_BRANCH" != "sandbox" ]; then
                echo "Running tests for $AWS_BRANCH..."
                npm run test || echo "Tests not configured, skipping..."
              fi
      artifacts:
        baseDirectory: coverage
        files:
          - '**/*'
        configFilePath: '**/coverage-final.json'